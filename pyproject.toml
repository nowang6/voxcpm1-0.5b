[project]
name = "voxcpm1-0-5b"
version = "0.1.0"
description = "VoxCPM1-0.5B inference and full-parameter fine-tuning (extracted from OpenBMB/VoxCPM)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.0",
    "huggingface-hub>=1.0.0",
    "inflect>=7.0.0",
    "datasets>=4.0.0",
    "numpy>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "regex>=2024.0.0",
    "safetensors>=0.5.0",
    "sentencepiece>=0.2.1",
    "soundfile>=0.13.0",
    "tensorboardX>=2.6.0",
    "torch>=2.10.0,<2.11.0",
    "torchaudio>=2.10.0,<2.11.0",
    "tqdm>=4.67.3",
    "transformers>=5.3.0",
    "wetext>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]
